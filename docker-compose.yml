version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql
      - ./docker/mssql/backup:/var/opt/mssql/backup  # Mount backup folder
      - ./docker/mssql/init.sql:/scripts/init.sql    # Mount initialization script
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -U sa -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1' -C || exit 1" ]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 60s
    networks:
      - app-network
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      db:
        condition: service_healthy
    command: >
      /bin/bash -c "
      /opt/mssql-tools/bin/sqlcmd -S db -U sa -P $${SA_PASSWORD} -d master -i /scripts/init.sql
      "
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - ./docker/mssql/init.sql:/scripts/init.sql  # Share the script
    networks:
      - app-network

  api:
    build:
      context: ./InvoiceManagementSystemAPI
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=${DATABASE};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      - db-init  # Wait for database initialization
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mssql_data:

networks:
  app-network:
    driver: bridge